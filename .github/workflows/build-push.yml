name: Build and Push Docker Image

on:
  push:
    branches:
      - feature/quic-mtu-config

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build WebUI
        working-directory: webui
        run: |
          corepack enable
          yarn install
          yarn build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      - name: Build binary (linux/amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist/linux/amd64
          go build \
            -ldflags "-s -w \
              -X github.com/traefik/traefik/v3/pkg/version.Version=$(git describe --tags --always) \
              -X github.com/traefik/traefik/v3/pkg/version.Codename=cheddar \
              -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u '+%Y-%m-%d_%I:%M:%S%p')" \
            -installsuffix nocgo \
            -o ./dist/linux/amd64/traefik \
            ./cmd/traefik

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/traefik:3.7.10-quic
            ghcr.io/${{ github.repository_owner }}/traefik:${{ github.sha }}
