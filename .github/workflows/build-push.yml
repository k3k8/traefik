name: Build and Push Docker Image

on:
  push:
    branches:
      - feature/quic-mtu-config

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build WebUI
        working-directory: webui
        run: |
          corepack enable
          yarn install
          yarn build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: '.go-version'
          cache: true

      # Cross-compiled on the runner (no emulation), one binary per target arch.
      # The Dockerfile picks the right one up via COPY ./dist/$TARGETPLATFORM/traefik.
      - name: Build binaries (linux/amd64, linux/arm64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: |
          # Computed once so every arch reports the same version and build date.
          LDFLAGS="-s -w \
            -X github.com/traefik/traefik/v3/pkg/version.Version=$(git describe --tags --always) \
            -X github.com/traefik/traefik/v3/pkg/version.Codename=cheddar \
            -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u '+%Y-%m-%d_%I:%M:%S%p')"

          for arch in amd64 arm64; do
            echo "::group::build linux/${arch}"
            mkdir -p "dist/linux/${arch}"
            GOARCH="${arch}" go build \
              -ldflags "${LDFLAGS}" \
              -installsuffix nocgo \
              -o "./dist/linux/${arch}/traefik" \
              ./cmd/traefik
            echo "::endgroup::"
          done

      # Needed to execute the Dockerfile's `RUN apk add` under linux/arm64
      # on an amd64 runner. The Go binaries themselves are cross-compiled above,
      # so only that one small step is emulated.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Multi-platform builds require the docker-container driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/traefik:3.7.10-quic
            ghcr.io/${{ github.repository_owner }}/traefik:${{ github.sha }}
